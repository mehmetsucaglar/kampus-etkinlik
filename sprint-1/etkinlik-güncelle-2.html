<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
</head>
<body>
<main>
       <main>
        <h2>Etkinlik Güncelle: Robotik Atölyesi</h2>

        <form action="#" method="post">
            <p>
                <label for="ad">Etkinlik Adı:</label><br>
                <input type="text" id="ad" name="ad" value="Robotik Atölyesi" required>
            </p>

            <p>
                <label for="kategori">Kategori:</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz...</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye" selected>Atölye</option>
                    <option value="Konferans">Konferans</option>
                    <option value="Sosyal">Sosyal</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih:</label><br>
                <input type="date" id="tarih" name="tarih" value="2026-10-20" required>
            </p>

            <p>
                <label for="saat">Saat:</label><br>
                <input type="time" id="saat" name="saat" value="10:30" required>
            </p>

            <p>
                <label for="yer">Yer:</label><br>
                <input type="text" id="yer" name="yer" value="Lab 2" required>
            </p>

            <p>
                <label for="aciklama">Açıklama:</label><br>
                <textarea id="aciklama" name="aciklama" rows="5" cols="40" required>Mikrodenetleyiciler ve sensörler ile otonom araç tasarımı temelleri eğitimi.</textarea>
            </p>

            <p>
                <button type="submit">Güncelle</button>
            </p>
        </form>
    </main>

        
    
    <a href="index.html">Listeye dön</a>
</body>
</html>
